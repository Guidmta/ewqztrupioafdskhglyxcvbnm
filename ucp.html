<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEELMTA - Bejelentkezés</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-white font-sans min-h-screen relative flex items-center justify-center overflow-hidden bg-cover bg-center" style="background-image: url('hatter.png');">

    <!-- Sötétítő réteg, hogy jól olvasható maradjon a panel -->
    <div class="absolute inset-0 z-0 bg-black/60 backdrop-blur-[2px]"></div>

    <!-- Felső léc a logóval és a Kezdőlap gombbal -->
    <div class="absolute top-0 left-0 right-0 p-6 flex justify-between items-center z-10 max-w-7xl mx-auto w-full">
        <div class="flex items-center gap-3">
            <img src="logo.png" alt="SEELMTA Logo" class="w-8 h-8 object-contain">
            <span class="font-bold text-base tracking-wider text-white">SEELMTA</span>
        </div>

        <a href="index.html" class="bg-zinc-900/80 hover:bg-zinc-800 border border-zinc-800 text-zinc-300 hover:text-white px-4 py-2 rounded-xl text-xs font-medium transition-colors flex items-center gap-2 backdrop-blur">
            ← Kezdőlap
        </a>
    </div>

    <!-- Bejelentkezési Doboz -->
    <div class="relative z-10 w-full max-w-md p-8 bg-zinc-900/90 border border-zinc-800/80 rounded-3xl shadow-2xl backdrop-blur-md space-y-6">
        <div class="text-center space-y-1">
            <h2 class="text-xl font-bold text-white tracking-wide">Bejelentkezés</h2>
            <p class="text-xs text-zinc-400">Add meg az adataid, melyekkel InGame regisztráltál.</p>
        </div>

        <form action="dashboard.html" method="GET" class="space-y-4" id="loginForm">
            <div>
                <label class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-2">Felhasználónév</label>
                <input type="text" id="username" name="username" required class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-red-500 transition-colors placeholder:text-zinc-600" placeholder="Felhasználónév...">
            </div>

            <div>
                <div class="flex justify-between items-center mb-2">
                    <label class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider">Jelszó</label>
                    <a href="#" class="text-xs text-red-400 hover:underline">Elfelejtett adatok?</a>
                </div>
                <div class="relative">
                    <input type="password" id="password" name="password" required class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-red-500 transition-colors pr-10" placeholder="••••••••">
                </div>
            </div>

            <div class="flex items-center gap-2 pt-1">
                <input type="checkbox" id="remember" class="rounded bg-zinc-950 border-zinc-800 text-red-500 focus:ring-0 w-4 h-4 cursor-pointer">
                <label for="remember" class="text-xs text-zinc-400 select-none cursor-pointer">Emlékezz rám</label>
            </div>

            <button type="submit" class="w-full bg-zinc-200 hover:bg-white text-zinc-950 font-semibold py-3 rounded-xl transition-colors shadow-lg flex items-center justify-center gap-2 text-sm mt-2">
                Bejelentkezés
            </button>
        </form>
    </div>

    <!-- Automatikus kitöltő script (Emlékezz rám funkció) -->
    <script>
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const rememberCheckbox = document.getElementById('remember');
        const loginForm = document.getElementById('loginForm');

        // Ha korábban már mentettek adatot, automatikusan betölti
        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('saved_username')) {
                usernameInput.value = localStorage.getItem('saved_username');
                passwordInput.value = localStorage.getItem('saved_password');
                rememberCheckbox.checked = true;
            }
        });

        // Ha rákattintanak a bejelentkezésre és be van pipálva, elmenti a böngészőbe
        loginForm.addEventListener('submit', () => {
            if (rememberCheckbox.checked) {
                localStorage.setItem('saved_username', usernameInput.value);
                localStorage.setItem('saved_password', passwordInput.value);
            } else {
                localStorage.removeItem('saved_username');
                localStorage.removeItem('saved_password');
            }
        });
    </script>

</body>
</html>
