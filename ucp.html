<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEELMTA - User Control Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-white font-sans min-h-screen relative flex flex-col justify-between overflow-x-hidden bg-cover bg-center" style="background-image: url('hatter.png');">

    <!-- Sötétítő réteg -->
    <div class="absolute inset-0 z-0 bg-black/60 backdrop-blur-[2px]"></div>

    <!-- Felső léc -->
    <div class="absolute top-0 left-0 right-0 p-6 flex justify-between items-center z-20 max-w-7xl mx-auto w-full">
        <div class="flex items-center gap-3">
            <img src="logo.png" alt="SEELMTA Logo" class="w-8 h-8 object-contain">
            <span class="font-bold text-base tracking-wider text-white">SEELMTA</span>
        </div>

        <!-- Kezdőlap gomb -->
        <a href="index.html" class="bg-zinc-900/80 hover:bg-zinc-800 border border-zinc-800 text-zinc-300 hover:text-white px-4 py-2 rounded-xl text-xs font-medium transition-colors flex items-center gap-2 backdrop-blur shadow">
            ← Kezdőlap
        </a>
    </div>

    <!-- Fő tartalom konténer -->
    <div class="relative z-10 flex flex-col items-center justify-center flex-grow w-full px-4 py-20">

        <!-- 1. BEJELENTKEZÉS NÉZET (Ez fogad mindenkit alapból) -->
        <div id="loginView" class="w-full max-w-md p-8 bg-zinc-900/90 border border-zinc-800/80 rounded-3xl shadow-2xl backdrop-blur-md space-y-6">
            <div class="text-center space-y-1">
                <h2 class="text-xl font-bold text-white tracking-wide">Bejelentkezés</h2>
                <p class="text-xs text-zinc-400">Add meg az adataid, melyekkel InGame regisztráltál.</p>
            </div>

            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-2">Felhasználónév</label>
                    <input type="text" id="username" required class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-red-500 transition-colors placeholder:text-zinc-600" placeholder="Felhasználónév...">
                </div>

                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider">Jelszó</label>
                        <a href="#" class="text-xs text-red-400 hover:underline">Elfelejtett adatok?</a>
                    </div>
                    <input type="password" id="password" required class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-red-500 transition-colors" placeholder="••••••••">
                </div>

                <div class="flex items-center gap-2 pt-1">
                    <input type="checkbox" id="remember" class="rounded bg-zinc-950 border-zinc-800 text-red-500 focus:ring-0 w-4 h-4 cursor-pointer">
                    <label for="remember" class="text-xs text-zinc-400 select-none cursor-pointer">Emlékezz rám</label>
                </div>

                <button type="submit" class="w-full bg-zinc-200 hover:bg-white text-zinc-950 font-semibold py-3 rounded-xl transition-colors shadow-lg flex items-center justify-center gap-2 text-sm mt-2">
                    Bejelentkezés
                </button>
            </form>
        </div>

        <!-- 2. VEZÉRLŐPULT NÉZET (Csak sikeres bejelentkezés után jelenik meg) -->
        <div id="dashboardView" class="hidden w-full max-w-5xl space-y-8">
            <div class="flex justify-between items-center">
                <h1 class="text-2xl md:text-3xl font-bold text-white tracking-wide">Üdvözlünk a Vezérlőpulton!</h1>
                <button id="logoutBtn" class="bg-zinc-900/80 hover:bg-red-500/20 text-red-400 border border-zinc-800 hover:border-red-500/50 px-4 py-2 rounded-xl text-xs font-medium transition-colors">
                    Kijelentkezés
                </button>
            </div>

            <!-- Adat kártyák (Serial váltás nélkül, pontosan a kért adatokkal) -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <!-- Karakter Név kártya -->
                <div class="bg-zinc-900/90 border border-zinc-800/80 rounded-2xl p-5 shadow-xl backdrop-blur-md space-y-1">
                    <span class="text-[11px] font-semibold text-zinc-400 uppercase tracking-wider">Karakter Név</span>
                    <div id="displayUsername" class="text-lg font-bold text-white truncate">Minta_Jatekos</div>
                </div>

                <!-- Serial kártya -->
                <div class="bg-zinc-900/90 border border-zinc-800/80 rounded-2xl p-5 shadow-xl backdrop-blur-md space-y-1">
                    <span class="text-[11px] font-semibold text-zinc-400 uppercase tracking-wider">Serial</span>
                    <div class="text-xs font-mono text-zinc-300 truncate bg-zinc-950/60 p-2 rounded-lg border border-zinc-800">11127EEDF5BDDBC4D4CCABDED3E13C72</div>
                </div>

                <!-- Készpénz kártya -->
                <div class="bg-zinc-900/90 border border-zinc-800/80 rounded-2xl p-5 shadow-xl backdrop-blur-md space-y-1">
                    <span class="text-[11px] font-semibold text-zinc-400 uppercase tracking-wider">Készpénz</span>
                    <div class="text-lg font-bold text-emerald-400">$ 307,500</div>
                </div>

                <!-- Játszott percek kártya -->
                <div class="bg-zinc-900/90 border border-zinc-800/80 rounded-2xl p-5 shadow-xl backdrop-blur-md space-y-1">
                    <span class="text-[11px] font-semibold text-zinc-400 uppercase tracking-wider">Játszott percek</span>
                    <div class="text-lg font-bold text-red-500">1,655 perc</div>
                </div>
            </div>
        </div>

    </div>

    <!-- Lábléc -->
    <footer class="relative z-10 py-6 text-center text-xs text-zinc-500 tracking-wider">
        © 2026 SEELMTA
    </footer>

    <!-- Logika -->
    <script>
        const loginView = document.getElementById('loginView');
        const dashboardView = document.getElementById('dashboardView');
        const loginForm = document.getElementById('loginForm');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const rememberCheckbox = document.getElementById('remember');
        const displayUsername = document.getElementById('displayUsername');
        const logoutBtn = document.getElementById('logoutBtn');

        // Oldal betöltésekor mindig a Bejelentkezés látszik először (kivéve, ha az "Emlékezz rám" miatt mentve van)
        window.addEventListener('DOMContentLoaded', () => {
            const savedUser = localStorage.getItem('seelmta_user');
            if (savedUser) {
                displayUsername.textContent = savedUser;
                loginView.classList.add('hidden');
                dashboardView.classList.remove('hidden');
            } else {
                loginView.classList.remove('hidden');
                dashboardView.classList.add('hidden');
            }
        });

        // Bejelentkezés gomb megnyomása
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const username = usernameInput.value;

            if (rememberCheckbox.checked) {
                localStorage.setItem('seelmta_user', username);
            }

            displayUsername.textContent = username;
            loginView.classList.add('hidden');
            dashboardView.classList.remove('hidden');
        });

        // Kijelentkezés gomb
        logoutBtn.addEventListener('click', () => {
            localStorage.removeItem('seelmta_user');
            usernameInput.value = '';
            passwordInput.value = '';
            rememberCheckbox.checked = false;
            dashboardView.classList.add('hidden');
            loginView.classList.remove('hidden');
        });
    </script>

</body>
</html>
